{% extends 'layout.html' %} {% block content %}
<div class="container">
  <h1>Text Analyzer</h1>
  <form action="{{ url_for('post') }}" method="POST">
    <div>
      <textarea rows="19" name="content" autofocus placeholder="Pega aquí el texto que quieras analizar!"></textarea>
    </div>
    <div>
      <input type="submit" class="btn" value="Process Text" />
    </div>
  </form>
</div>

{% endblock %}
