{% extends 'layout.html' %} 
{% block content %}
<div class="container">
  <h1>Manage Students</h1>
  
  <div class="student-controls">
    <a href="/add-student" class="btn">Add New Student</a>
  </div>
  
  <div class="student-list">
    <table class="student-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Country</th>
          <th>City</th>
          <th>Skills</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for student in students %}
        <tr data-id="{{ student._id }}">
          <td>{{ student.name }}</td>
          <td>{{ student.country }}</td>
          <td>{{ student.city }}</td>
          <td>{{ student.skills|join(', ') }}</td>
          <td class="actions">
            <button class="btn-edit" onclick="editStudent('{{ student._id }}')">Edit</button>
            <button class="btn-delete" onclick="deleteStudent('{{ student._id }}')">Delete</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  
  <!-- Modal para editar estudiante -->
  <div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Edit Student</h2>
      <form id="editForm">
        <input type="hidden" id="studentId">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="country">Country:</label>
          <input type="text" id="country" name="country" required>
        </div>
        <div class="form-group">
          <label for="city">City:</label>
          <input type="text" id="city" name="city" required>
        </div>
        <div class="form-group">
          <label for="skills">Skills (comma separated):</label>
          <input type="text" id="skills" name="skills">
        </div>
        <div class="form-group">
          <label for="birthyear">Birth Year:</label>
          <select id="birthyear" name="birthyear" class="form-select">
            <option value="">Select Year</option>
            <script>
              const currentYear = new Date().getFullYear();
              for (let year = currentYear; year >= 1900; year--) {
                document.write(`<option value="${year}">${year}</option>`);
              }
            </script>
          </select>
        </div>
        <div class="form-group">
          <label for="bio">Bio:</label>
          <textarea id="bio" name="bio" rows="4"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">Save Changes</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  
  <div id="confirmationMessage" class="confirmation-message"></div>
</div>

<script>
  const apiBaseUrl = '/api/v1.0/students';
  const modal = document.getElementById('editModal');
  const closeBtn = document.querySelector('.close');
  const confirmationMessage = document.getElementById('confirmationMessage');

  function closeModal() {
    modal.style.display = "none";
  }

  closeBtn.onclick = function () {
    closeModal();
  }

  window.onclick = function (event) {
    if (event.target == modal) {
      closeModal();
    }
  }

  function editStudent(id) {
      fetch(`${apiBaseUrl}/${id}`)
        .then(response => response.json())
        .then(student => {
          // Aseguramos que el _id se almacene como string en el campo oculto
          document.getElementById('studentId').value = student._id.$oid || student._id;

          document.getElementById('name').value = student.name || '';
          document.getElementById('country').value = student.country || '';
          document.getElementById('city').value = student.city || '';
          document.getElementById('skills').value = student.skills ? student.skills.join(', ') : '';

          const birthyearSelect = document.getElementById('birthyear');
          if (student.birthyear) {
            for (let i = 0; i < birthyearSelect.options.length; i++) {
              if (birthyearSelect.options[i].value == student.birthyear) {
                birthyearSelect.selectedIndex = i;
                break;
              }
            }
          } else {
            birthyearSelect.selectedIndex = 0;
          }

          document.getElementById('bio').value = student.bio || '';
          modal.style.display = "block";
        })
        .catch(error => {
          showMessage(`Error loading student data: ${error.message}`, 'error');
        });
    }

    // Manejo del submit
    document.getElementById('editForm').addEventListener('submit', function(e) {
      e.preventDefault();

      const id = document.getElementById('studentId').value.trim();

      if (!id) {
        showMessage('Error: Student ID is missing', 'error');
        return;
      }

      const formData = new FormData(this);

      fetch(`/api/v1.0/students/${id}`, {
        method: 'PUT',
        body: formData
      })
      .then(response => {
        if (!response.ok) {
          return response.json().then(err => {
            throw new Error(err.error || 'Error updating student');
          });
        }
        return response.json();
      })
      .then(data => {
        closeModal();
        showMessage('Student updated successfully!', 'success');
        setTimeout(() => location.reload(), 1500);
      })
      .catch(error => {
        showMessage(`Error updating student: ${error.message}`, 'error');
      });
    });


  function deleteStudent(id) {
    if (confirm('Are you sure you want to delete this student?')) {
      fetch(`${apiBaseUrl}/${id}`, {
        method: 'DELETE'
      })
        .then(response => response.json())
        .then(data => {
        showMessage('Student deleted successfully!', 'success');
        document.querySelector(`tr[data-id="${id}"]`).remove();
        })
        .catch(error => {
          showMessage(`Error deleting student: ${error.message}`, 'error');
        });
    }
  }

  function showMessage(message, type) {
    confirmationMessage.textContent = message;
    confirmationMessage.className = `confirmation-message ${type}`;
    confirmationMessage.style.display = "block";
    setTimeout(() => {
      confirmationMessage.style.display = "none";
    }, 3000);
  }
</script>
{% endblock %}
