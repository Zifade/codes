{% extends 'layout.html' %} {% block content %}
<div class="container">
  <h1>Manage Students</h1>
  
  <div class="student-controls">
    <a href="/add-student" class="btn">Add New Student</a>
  </div>
  
  <div class="student-list">
    <table class="student-table">
      <thead>
        <tr>
          <th>Name</th>
          <th>Country</th>
          <th>City</th>
          <th>Skills</th>
          <th>Actions</th>
        </tr>
      </thead>
      <tbody>
        {% for student in students %}
        <tr data-id="{{ student._id }}">
          <td>{{ student.name }}</td>
          <td>{{ student.country }}</td>
          <td>{{ student.city }}</td>
          <td>{{ student.skills|join(', ') }}</td>
          <td class="actions">
            <button class="btn-edit" onclick="editStudent('{{ student._id }}')">Edit</button>
            <button class="btn-delete" onclick="deleteStudent('{{ student._id }}')">Delete</button>
          </td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
  
  <!-- Modal para editar estudiante -->
<div id="editModal" class="modal">
    <div class="modal-content">
      <span class="close">&times;</span>
      <h2>Edit Student</h2>
      <form id="editForm">
        <input type="hidden" id="studentId">
        <div class="form-group">
          <label for="name">Name:</label>
          <input type="text" id="name" name="name" required>
        </div>
        <div class="form-group">
          <label for="country">Country:</label>
          <input type="text" id="country" name="country" required>
        </div>
        <div class="form-group">
          <label for="city">City:</label>
          <input type="text" id="city" name="city" required>
        </div>
        <div class="form-group">
          <label for="skills">Skills (comma separated):</label>
          <input type="text" id="skills" name="skills">
        </div>
        <div class="form-group">
          <label for="birthyear">Birth Year:</label>
          <select id="birthyear" name="birthyear" class="form-select">
            <option value="">Select Year</option>
            <script>
              // Generar opciones para años desde 1900 hasta el año actual
              const currentYear = new Date().getFullYear();
              for (let year = currentYear; year >= 1900; year--) {
                document.write(`<option value="${year}">${year}</option>`);
              }
            </script>
          </select>
        </div>
        <div class="form-group">
          <label for="bio">Bio:</label>
          <textarea id="bio" name="bio" rows="4"></textarea>
        </div>
        <div class="form-actions">
          <button type="submit" class="btn">Save Changes</button>
          <button type="button" class="btn btn-secondary" onclick="closeModal()">Cancel</button>
        </div>
      </form>
    </div>
  </div>
  
  <!-- Mensaje de confirmación -->
  <div id="confirmationMessage" class="confirmation-message"></div>
</div>

<script>
    // Variables globales
    const apiBaseUrl = '/api/v1.0/students';
    const modal = document.getElementById('editModal');
    const closeBtn = document.querySelector('.close');
    const confirmationMessage = document.getElementById('confirmationMessage');
    
    // Función para cerrar el modal (NUEVA)
    function closeModal() {
      modal.style.display = "none";
    }
    
    // Cerrar el modal al hacer clic en X
    closeBtn.onclick = function() {
      closeModal();  // MODIFICADO: Usa la nueva función
    }
    
    // Cerrar el modal al hacer clic fuera de él
    window.onclick = function(event) {
      if (event.target == modal) {
        closeModal();  // MODIFICADO: Usa la nueva función
      }
    }
    
    // Función para editar un estudiante
    function editStudent(id) {
      // Obtener datos del estudiante
      fetch(`${apiBaseUrl}/${id}`)
        .then(response => response.json())
        .then(student => {
          // Llenar el formulario con los datos del estudiante
          document.getElementById('studentId').value = student._id;
          document.getElementById('name').value = student.name || '';
          document.getElementById('country').value = student.country || '';
          document.getElementById('city').value = student.city || '';
          document.getElementById('skills').value = student.skills ? student.skills.join(', ') : '';
          
          // MODIFICADO: Manejo del dropdown de birthyear
          const birthyearSelect = document.getElementById('birthyear');
          if (student.birthyear) {
            // Buscar la opción con el valor correspondiente
            for (let i = 0; i < birthyearSelect.options.length; i++) {
              if (birthyearSelect.options[i].value == student.birthyear) {
                birthyearSelect.selectedIndex = i;
                break;
              }
            }
          } else {
            birthyearSelect.selectedIndex = 0; // Seleccionar "Select Year"
          }
          
          document.getElementById('bio').value = student.bio || '';
          
          // Mostrar el modal
          modal.style.display = "block";
        })
        .catch(error => {
          showMessage(`Error loading student data: ${error.message}`, 'error');
        });
    }
    
    // Manejar el envío del formulario de edición
    document.getElementById('editForm').addEventListener('submit', function(e) {
    e.preventDefault();
    
    // Obtener el ID del estudiante
    const id = document.getElementById('studentId').value.trim();
    
    if (!id) {
        showMessage('Error: Student ID is missing', 'error');
        return;
    }
    
    // Crear FormData con los datos del formulario
    const formData = new FormData(this);
    
    console.log('Updating student with ID:', id);
    
    // Enviar la solicitud PUT
    fetch(`/api/v1.0/students/${id}`, {
        method: 'PUT',
        body: formData
    })
    .then(response => {
        if (!response.ok) {
            return response.json().then(err => {
                throw new Error(err.error || 'Error updating student');
            });
        }
        return response.json();
    })
    .then(data => {
        console.log('Server response:', data);
        
        // Cerrar el modal
        closeModal();
        
        // Mostrar mensaje de éxito
        showMessage('Student updated successfully!', 'success');
        
        // Recargar la página para mostrar los datos actualizados
        setTimeout(() => {
            location.reload();
        }, 1500);
    })
    .catch(error => {
        console.error('Error:', error);
        showMessage(`Error updating student: ${error.message}`, 'error');
    });
});
    
    // Función para eliminar un estudiante
    function deleteStudent(id) {
      if (confirm('Are you sure you want to delete this student?')) {
        fetch(`${apiBaseUrl}/${id}`, {
          method: 'DELETE'
        })
        .then(response => response.json())
        .then(data => {
          // Mostrar mensaje de éxito
          showMessage('Student deleted successfully!', 'success');
          
          // Eliminar la fila de la tabla
          document.querySelector(`tr[data-id="${id}"]`).remove();
        })
        .catch(error => {
          showMessage(`Error deleting student: ${error.message}`, 'error');
        });
      }
    }
    
    // Función para mostrar mensajes
    function showMessage(message, type) {
      confirmationMessage.textContent = message;
      confirmationMessage.className = `confirmation-message ${type}`;
      confirmationMessage.style.display = "block";
      
      // Ocultar el mensaje después de 3 segundos
      setTimeout(() => {
        confirmationMessage.style.display = "none";
      }, 3000);
    }
  </script>
{% endblock %}
